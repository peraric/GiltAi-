<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GiltAi — an independent AI assistant." />
  <title>GiltAi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">G</div><strong>GiltAi</strong></div>
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="section-label">Today</div>
      <div id="history" class="history"></div>
      <div class="sidebar-footer"><div class="avatar">U</div><div><strong>You</strong><span>GiltAi</span></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand"><div class="logo">G</div><strong>GiltAi</strong></div>
        <button class="model">GiltAi <span>⌄</span></button>
      </header>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="hero-logo">G</div>
          <h1>How can I help?</h1>
          <p>Ask GiltAi to think, write, code, explain, plan, or create with you.</p>
          <div class="cards">
            <button data-prompt="Help me build a website">Build a website</button>
            <button data-prompt="Explain artificial intelligence simply">Explain AI</button>
            <button data-prompt="Help me write some code">Write code</button>
            <button data-prompt="Help me plan my next project">Plan a project</button>
          </div>
        </div>
      </section>

      <div class="composer-area">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message GiltAi..."></textarea>
          <button class="send" aria-label="Send">↑</button>
        </form>
        <p class="notice">GiltAi can make mistakes. Check important information.</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
